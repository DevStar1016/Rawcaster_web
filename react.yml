apiVersion: apps/v1
kind: Deployment
metadata:
  name: react
  namespace: dev
  labels:
    app: react
spec:
  selector:
    matchLabels:
      app: react
  replicas: 1
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: 562114208112.dkr.ecr.us-east-1.amazonaws.com/rawcaster-react:rawcaster_react_2.0
          imagePullPolicy: Always
          envFrom:
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
